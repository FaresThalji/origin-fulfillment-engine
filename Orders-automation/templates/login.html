<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIGIN · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0D12;
    --void-2:#0E1219;
    --panel: rgba(21,25,33,0.68);
    --line: rgba(255,255,255,0.08);
    --line-soft: rgba(255,255,255,0.045);
    --ink:#ECEEF2;
    --dim:#8A93A3;
    --dimmer:#5A6273;
    --signal:#FF8A3D;
    --signal-glow: rgba(255,138,61,0.32);
    --rail:#2DD4BF;
    --rail-glow: rgba(45,212,191,0.28);
    --err:#FF5C5C;
    --err-soft: rgba(255,92,92,0.12);
    --font-d:'Space Grotesk', sans-serif;
    --font-b:'Inter', sans-serif;
    --font-m:'JetBrains Mono', monospace;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{ background: var(--void); color: var(--ink); font-family: var(--font-b); overflow:hidden; position:relative; }

  .field{ position:fixed; inset:0; z-index:0; }
  .field-grid{
    position:absolute; inset:0;
    background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .field-glow-a{ position:absolute; width:60vw; height:60vw; left:-18vw; top:-16vw; border-radius:50%; background: radial-gradient(circle, var(--signal-glow) 0%, transparent 62%); filter:blur(10px); opacity:.5; }
  .field-glow-b{ position:absolute; width:46vw; height:46vw; right:-10vw; bottom:-14vw; border-radius:50%; background: radial-gradient(circle, var(--rail-glow) 0%, transparent 62%); filter:blur(10px); opacity:.4; }

  .stage{ position:relative; z-index:2; height:100vh; display:grid; grid-template-columns: 1.15fr 1fr; }
  @media (max-width: 900px){ .stage{ grid-template-columns: 1fr; } .showcase{ display:none; } }

  .showcase{ display:flex; flex-direction:column; justify-content:center; padding: 0 6vw; border-right:1px solid var(--line-soft); }
  .showcase-eyebrow{ font-family:var(--font-m); font-size:11px; letter-spacing:3px; color:var(--signal); text-transform:uppercase; margin-bottom:22px; display:flex; align-items:center; gap:10px; }
  .showcase-eyebrow::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--rail); box-shadow:0 0 8px var(--rail-glow); }
  .showcase h1{ font-family:var(--font-d); font-weight:600; font-size: clamp(30px,3.6vw,46px); line-height:1.08; letter-spacing:-0.5px; }
  .showcase h1 em{ font-style:normal; color:var(--signal); }
  .showcase p{ margin-top:20px; color:var(--dim); font-size:14.5px; line-height:1.65; }

  .manifest{ margin-top:46px; width: min(420px, 90%); border:1px solid var(--line); border-radius:12px; background:var(--panel); backdrop-filter: blur(14px); overflow:hidden; }
  .manifest-head{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line-soft); font-family:var(--font-m); font-size:10.5px; color:var(--dimmer); text-transform:uppercase; }
  .manifest-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-bottom:1px solid var(--line-soft); font-family:var(--font-m); font-size:12px; }
  .dot{ width:6px; height:6px; border-radius:50%; }
  .dot.ok{ background:var(--rail); box-shadow:0 0 8px var(--rail-glow); }

  .auth{ display:flex; align-items:center; justify-content:center; padding: 5vw; }
  .card{ width: 100%; max-width:400px; }

  .brand-row{ display:flex; align-items:center; gap:14px; margin-bottom:34px; }
  .beacon{ width:40px; height:40px; position:relative; }
  .beacon svg{ width:100%; height:100%; overflow:visible; }
  .beacon-hex{ fill:none; stroke:var(--signal); stroke-width:1.6; }
  .beacon-core{ fill:var(--signal); }
  .brand-name{ font-family:var(--font-d); font-weight:700; font-size:17px; letter-spacing:1px; }
  .brand-sub{ font-family:var(--font-m); font-size:9.5px; color:var(--dimmer); letter-spacing:2px; text-transform:uppercase; }

  .card h2{ font-family:var(--font-d); font-weight:600; font-size:26px; margin-bottom:6px; }
  .card > p.lede{ color:var(--dim); font-size:13.5px; margin-bottom:30px; }

  .err-banner{ display:none; align-items:center; gap:10px; background:var(--err-soft); border:1px solid rgba(255,92,92,0.35); color:var(--err); padding:11px 14px; border-radius:9px; font-size:12.5px; margin-bottom:20px; }
  .err-banner.show{ display:flex; }

  .field-group{ position:relative; margin-bottom:18px; }
  .field-group label{ position:absolute; left:15px; top:15px; font-size:13.5px; color:var(--dimmer); pointer-events:none; transition: all .2s var(--ease); }
  .field-group input{ width:100%; background:var(--void-2); border:1px solid var(--line); border-radius:9px; padding:22px 15px 10px; color:var(--ink); font-size:14px; font-family:var(--font-m); outline:none; }
  .field-group input:focus{ border-color:var(--signal); box-shadow: 0 0 0 3px var(--signal-glow); }
  .field-group input:focus + label, .field-group input:not(:placeholder-shown) + label{ top:7px; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--signal); }

  .submit{ width:100%; height:52px; margin-top:8px; border:none; border-radius:9px; cursor:pointer; background: var(--ink); color:var(--void); font-family:var(--font-d); font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center; gap:10px; transition: .3s; }
  .submit:hover{ background: var(--signal); color:#1a0f04; box-shadow: 0 12px 28px var(--signal-glow); }
  .submit .spin{ width:17px; height:17px; border-radius:50%; border:2px solid rgba(0,0,0,.18); border-top-color:currentColor; display:none; animation: rot .7s linear infinite; }
  @keyframes rot{ to{ transform:rotate(360deg); } }
  .submit.loading .spin{ display:block; }
  .submit.loading .label{ display:none; }
  .submit.ok{ background:var(--rail); }

  .sig{ position:fixed; bottom:24px; right:30px; font-family:var(--font-m); font-size:10px; color:var(--dimmer); letter-spacing:1px; }
</style>
</head>
<body>

<div class="field">
  <div class="field-grid"></div>
  <div class="field-glow-a"></div>
  <div class="field-glow-b"></div>
</div>

<div class="stage">
  <div class="showcase">
    <div class="showcase-eyebrow">Sandbox environment</div>
    <h1>Multi-channel command for <em>fulfillment operations.</em></h1>
    <div class="manifest">
      <div class="manifest-head"><span>System Architecture</span><span>Mock Mode</span></div>
      <div class="manifest-row"><span style="color:var(--dim);">Status Pipeline</span><span style="display:flex;align-items:center;gap:6px;"><span class="dot ok"></span>Operational</span></div>
    </div>
  </div>

  <div class="auth">
    <div class="card">
      <div class="brand-row">
        <div class="beacon">
          <svg viewBox="0 0 100 100">
            <polygon class="beacon-hex" points="50,10 86,30 86,70 50,90 14,70 14,30"/>
            <circle class="beacon-core" cx="50" cy="50" r="4"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">ORIGIN</div>
          <div class="brand-sub">Operations console</div>
        </div>
      </div>

      <h2>Sign in</h2>
      <p class="lede">Enter your authentication identifiers to access the operations deck.</p>

      <div class="err-banner" id="errBanner"></div>

      <form id="loginForm">
        <div class="field-group">
          <input type="text" name="company" placeholder=" " autocomplete="off" required value="DEMO">
          <label>Company</label>
        </div>
        <div class="field-group">
          <input type="text" name="username" placeholder=" " autocomplete="username" required value="demo">
          <label>Username</label>
        </div>
        <div class="field-group">
          <input type="password" name="password" placeholder=" " autocomplete="current-password" required value="demo">
          <label>Password</label>
        </div>

        <button type="submit" class="submit" id="submitBtn">
          <span class="label">Enter console</span>
          <div class="spin"></div>
        </button>
      </form>
    </div>
  </div>
</div>

<div class="sig">ORIGIN OPEN SOURCE BUILD</div>

<script>
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errBanner');

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    err.classList.remove('show');
    btn.classList.add('loading');

    try{
      const res = await fetch('/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          company: form.company.value,
          username: form.username.value,
          password: form.password.value
        })
      });
      const data = await res.json();
      if(data.success){
        btn.classList.remove('loading');
        btn.classList.add('ok');
        btn.querySelector('.label').textContent = 'Access granted';
        setTimeout(()=>{ window.location.href = '/dashboard'; }, 400);
      } else {
        throw new Error(data.error || 'Authentication failed');
      }
    } catch(ex){
      btn.classList.remove('loading');
      err.textContent = ex.message;
      err.classList.add('show');
    }
  });
</script>
</body>
</html>
